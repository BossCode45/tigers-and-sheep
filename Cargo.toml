[package]
name = "tigers-and-sheep-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tigers-and-sheep-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
rayon = "1.12.0"

[features]
# Count nodes, cache hits and cutoffs during the search, for `bench`.
search-stats = []

# A release build that keeps debug info, for profilers: `cargo build --profile profiling`
[profile.profiling]
inherits = "release"
debug = true
